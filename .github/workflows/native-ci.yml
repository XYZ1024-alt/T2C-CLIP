name: native-ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Install Python and build the mandatory extension
        run: |
          uv python install 3.14
          uv sync --locked
      - name: Verify native ABI
        run: uv run python -c "from t2c_clip.native import NATIVE_VERSION, NATIVE_ABI_VERSION; print(NATIVE_VERSION, NATIVE_ABI_VERSION)"
      - name: Rust tests
        run: uv run cargo test --manifest-path rust/Cargo.toml --locked
      - name: Python tests
        run: uv run python -m unittest discover -s tests
      - name: Compile and inspect CLIs
        run: |
          uv run python -m compileall -q t2c_clip scripts tests
          uv run python -m scripts.train --help
          uv run python -m t2c_clip.cli.evaluate --help
          uv run python -m t2c_clip.cli.benchmark_native --help
      - name: Build release wheel
        run: uvx maturin build --release --locked --out dist
      - name: Install and smoke-test release wheel outside checkout
        run: uv run python -c "import subprocess,sys,tempfile; from pathlib import Path; from zipfile import ZipFile; wheel=next(Path('dist').glob('*.whl')); names=ZipFile(wheel).namelist(); assert 'scripts/train.py' in names; assert any(name.startswith('t2c_clip/_native.') and name.endswith(('.pyd','.so')) for name in names); subprocess.run(['uv','pip','install','--python',sys.executable,'--force-reinstall','--no-deps',str(wheel)],check=True); cwd=tempfile.mkdtemp(); subprocess.run([sys.executable,'-c','from t2c_clip.native import NATIVE_VERSION; print(NATIVE_VERSION)'],cwd=cwd,check=True); subprocess.run([sys.executable,'-m','scripts.train','--help'],cwd=cwd,check=True,stdout=subprocess.DEVNULL)"
