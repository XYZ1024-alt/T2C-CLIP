[project]
name = "t2c-reid"
version = "0.1.0"
description = "Train2Central ReID research codebase for Image-to-Image person re-identification"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "tqdm>=4.66.5",
    "transformers>=5.14.1",
    "wandb>=0.28.1",
]

[project.scripts]
train = "scripts.train:main"

[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "rust/Cargo.toml"
module-name = "t2c_reid._native"
python-source = "."
python-packages = ["t2c_reid", "scripts"]
bindings = "pyo3"
strip = true

[[tool.uv.index]]
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132"
