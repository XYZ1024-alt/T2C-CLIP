[package]
name = "t2c-clip-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
fast_image_resize = "5.1.4"
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
numpy = "0.29.0"
pyo3 = "0.29.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
rayon = "1.12.0"
thiserror = "2.0.17"

[profile.release]
codegen-units = 1
lto = "thin"
